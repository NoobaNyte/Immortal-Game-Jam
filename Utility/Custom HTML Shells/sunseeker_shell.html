<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
	<title>$GODOT_PROJECT_NAME</title>
	<style>
		/* Base page styling */
		body {
			margin: 0;
			padding: 0;
			overflow: hidden;
			background-color: #111111; /* Dark background behind canvas */
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
		}

		/* The game canvas */
		#canvas {
			display: block;
			width: 100vw;
			height: 100vh;
		}

		/* Loading Screen Overlay */
		#loading-ui {
			position: absolute;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			background-color: #1a1a1a;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			z-index: 10;
			transition: opacity 0.5s ease, visibility 0.5s;
		}

		/* Hide class for the fade-out effect */
		#loading-ui.hidden {
			opacity: 0;
			visibility: hidden;
		}

		/* Game Title / Logo */
		#game-title {
			color: #ffffff;
			font-size: 32px;
			font-weight: bold;
			margin-bottom: 20px;
			letter-spacing: 2px;
			text-transform: uppercase;
		}

		/* Progress Bar Container */
		#progress-container {
			width: 300px;
			height: 12px;
			background-color: #333333;
			border-radius: 6px;
			overflow: hidden;
			box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
		}

		/* The Fill (Tomato Red) */
		#progress-bar {
			width: 0%;
			height: 100%;
			background-color: #e53935;
			border-radius: 6px;
			transition: width 0.1s linear;
		}

		/* Status Text */
		#status-text {
			color: #aaaaaa;
			font-size: 14px;
			margin-top: 12px;
			font-weight: 500;
		}
	</style>
</head>
<body>
	<!-- Godot attaches the game here -->
	<canvas id="canvas"></canvas>

	<!-- Custom Loading Overlay -->
	<div id="loading-ui">
		<!-- You can replace this text with an <img src="logo.png"> if you have a logo file next to your index.html -->
		<div id="game-title">$GODOT_PROJECT_NAME</div>
		
		<div id="progress-container">
			<div id="progress-bar"></div>
		</div>
		<div id="status-text">Loading... 0%</div>
	</div>

	<!-- Godot Engine Script -->
	<script src="$GODOT_URL"></script>

	<script>
		const GODOT_CONFIG = $GODOT_CONFIG;
		const engine = new Engine(GODOT_CONFIG);

		const loadingUI = document.getElementById('loading-ui');
		const progressBar = document.getElementById('progress-bar');
		const statusText = document.getElementById('status-text');

		// Hook into Godot's loading progress
        engine.setProgressFunc((current, total) => {
            if (total > 0) {
                const percent = Math.round((current / total) * 100);
				progressBar.style.width = percent + '%';
				statusText.innerText = 'Loading... ' + percent + '%';
            } else {
				statusText.innerText = 'Loading...';
            }
        });

        // Initialize the engine and start the game
        engine.startGame().then(() => {
            // Once the engine starts successfully, trigger the fade-out
			loadingUI.classList.add('hidden');
            
            // Auto-focus the canvas so keyboard inputs work immediately on itch.io
			document.getElementById('canvas').focus();
        }).catch((err) => {
            console.error("Godot Engine failed to start:", err);
			statusText.innerText = 'Error loading game.';
			statusText.style.color = '#ff5555';
        });
    </script>
</body>
</html>
